  <style>
    /* Prevent general page scrolling to keep layout fully responsive and viewport-bound */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #020617; /* Dark concert stage background */
    }
    /* Sleek custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    /* Glowing animations for active multipliers and menus */
    @keyframes neon-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); border-color: rgba(168, 85, 247, 0.5); }
      50% { box-shadow: 0 0 25px rgba(236, 72, 153, 1); border-color: rgba(236, 72, 153, 1); }
    }
    .animate-glow-pulse { animation: neon-glow 1.8s ease-in-out infinite; }

    /* Intense Earthquake Shake Effect */
    @keyframes earthquake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-2px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .animate-earthquake { 
        animation: earthquake 0.25s infinite; 
        box-shadow: inset 0 0 150px rgba(14, 165, 233, 0.2);
    }

    /* Concert Strobe and Spark Effects */
    @keyframes strobe {
      0%, 100% { opacity: 0; }
      10%, 14% { opacity: 0.5; }
      12% { opacity: 0.8; }
      50% { opacity: 0; }
      60%, 64% { opacity: 0.3; }
      62% { opacity: 0.6; }
    }
    .animate-strobe { animation: strobe 3.5s infinite; }

    @keyframes spark-fly {
      0% { transform: translateY(100vh) translateX(0px) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-20vh) translateX(var(--drift, 0px)) scale(0.2); opacity: 0; }
    }
    .spark {
      position: absolute;
      top: 0;
      width: 4px;
      height: 24px;
      border-radius: 50%;
      animation: spark-fly linear infinite;
    }

    /* Narwhal Swarm Animation */
    @keyframes swim-across {
      0% { transform: translateX(-150vw) translateY(50px) rotate(-5deg); opacity: 0; }
      15% { opacity: 1; }
      50% { transform: translateX(0) translateY(-20px) rotate(5deg); }
      85% { opacity: 1; }
      100% { transform: translateX(150vw) translateY(30px) rotate(-5deg); opacity: 0; }
    }
    .animate-swim {
      animation: swim-across 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    
    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px; width: 24px;
      border-radius: 50%;
      background: #f472b6;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 0 10px #f472b6;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 8px;
      cursor: pointer;
      background: #1e293b;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    input[type=range]:focus { outline: none; }
  </style>
</head>

    // --- PROCEDURAL AUDIO ENGINE (80s/90s Rock & DJ Synth) ---
    const AudioEngine = {
        ctx: null,
        nextNoteTime: 0,
        currentStep: 0,
        timerID: null,
        isPlaying: false,
        isMuted: false,
        bpm: 120,
        mode: 'medium',
        theme: 'rock',

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },

        playOsc(type, freq, time, duration, vol) {
            if (this.isMuted) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(vol, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + duration);
        },

        playNoise(time, duration, vol) {
            if (this.isMuted) return;
            const bufferSize = this.ctx.sampleRate * duration;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = this.ctx.createGain();
            
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;

            gain.gain.setValueAtTime(vol, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(time);
        },

        scheduleNote() {
            if (!this.isPlaying) return;
            const secondsPerBeat = 60.0 / this.bpm;
            const timeSpan = secondsPerBeat * 0.25; // 16th notes

            while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                this.playStep(this.currentStep, this.nextNoteTime);
                this.nextNoteTime += timeSpan;
                this.currentStep = (this.currentStep + 1) % 16;
            }
            this.timerID = requestAnimationFrame(this.scheduleNote.bind(this));
        },

        playStep(step, time) {
            // Base Drum Kit
            if (step % 4 === 0) this.playOsc('sine', 50, time, 0.4, 0.8); // Kick
            if (step % 8 === 4) this.playNoise(time, 0.2, 0.4); // Snare
            if (step % 2 === 0) this.playNoise(time, 0.05, 0.08); // Hi-hat

            const rootFreq = 65.41; // C2

            if (this.theme === 'rock') {
                if (this.mode === 'training') {
                    // Slow steady bass
                    if (step % 4 === 0) this.playOsc('sawtooth', rootFreq, time, 0.4, 0.25);
                } else if (this.mode === 'medium') {
                    // Syncopated Groove
                    const notes = [rootFreq, 0, rootFreq, 0, rootFreq*1.189, 0, rootFreq*1.334, 0, rootFreq, 0, rootFreq, 0, rootFreq*0.89, 0, rootFreq*0.89, 0];
                    if (notes[step]) this.playOsc('square', notes[step], time, 0.3, 0.25);
                } else {
                    // Galloping 16ths (Expert/Narwhal)
                    const notes = [rootFreq, rootFreq, rootFreq, 0, rootFreq*1.189, rootFreq*1.189, rootFreq*1.189, 0, rootFreq*1.334, rootFreq*1.334, rootFreq*1.334, 0, rootFreq*1.498, 0, rootFreq*1.498, 0];
                    if (notes[step]) this.playOsc('sawtooth', notes[step], time, 0.15, 0.25);
                }
            } else {
                // DJ / Electronic Theme
                if (step % 8 === 0) this.playOsc('sine', rootFreq * 0.5, time, 0.8, 0.5); // Deep sub

                const arp = [rootFreq*2, rootFreq*3, rootFreq*4, rootFreq*3];
                if (this.mode === 'training') {
                     if (step % 4 === 0) this.playOsc('triangle', arp[(step/4)%4], time, 0.3, 0.15);
                } else {
                     this.playOsc('triangle', arp[step%4], time, 0.15, 0.15); // Fast arpeggio
                }
            }
        },

        start(mode, theme) {
            this.mode = mode;
            this.theme = theme;
            
            if (mode === 'training') this.bpm = 90;
            else if (mode === 'medium') this.bpm = 120;
            else if (mode === 'expert') this.bpm = 150;
            else if (mode === 'narwhal') this.bpm = 180;

            this.init();
            if (!this.isPlaying) {
                this.isPlaying = true;
                this.currentStep = 0;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduleNote();
            }
        },

        stop() {
            this.isPlaying = false;
            if (this.timerID) cancelAnimationFrame(this.timerID);
        },
        
        toggleMute() {
            this.isMuted = !this.isMuted;
            return this.isMuted;
        }
    };
